name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: debian
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.gitea/actions/setup
        with:
          system-packages: wget

      - name: Configure git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build package files
        run: bun run build

      - name: Generate changelog with git-cliff
        run: |
          wget -qO- https://github.com/orhun/git-cliff/releases/download/v2.10.1/git-cliff-2.10.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./git-cliff-2.10.1/git-cliff --tag ${GITHUB_REF_NAME} --output CHANGELOG.md

      - name: Create Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          body_path: CHANGELOG.md

      - name: Configure npm for publishing
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: npm publish --access public
